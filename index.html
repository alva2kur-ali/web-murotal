<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murotal Al-Qur'an Digital</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Background Masjid Nabawi Full Screen + Lapisan Gelap agar Kontras */
            background-color: #0f172a;
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.85)),
                url('https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .card {
            /* Efek Glassmorphism (Transparan Buram) agar Masjid Nabawi tetap terlihat */
            background: rgba(30, 41, 59, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            margin: 20px auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.85);
            color: white;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #10b981;
        }

        /* Wadah input password agar ikon mata rapi di dalam kotak */
        .password-wrapper {
            position: relative;
            width: 100%;
            margin: 8px 0;
        }

        .password-wrapper input {
            margin: 0;
            padding-right: 44px; /* Ruang untuk ikon mata */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            margin: 0;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #f8fafc;
            background: transparent;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
            border: none;
            background: #10b981;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #059669;
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .link-toggle {
            color: #38bdf8;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .status-msg {
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }

        .error {
            color: #f87171;
        }

        .success {
            color: #34d399;
        }

        .select-label {
            display: block;
            text-align: left;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- FORM LOGIN -->
    <div id="login-box" class="card">
        <h2>Login Murotal</h2>
        <input type="text" id="login-kontak" placeholder="Email atau No. WA" required>
        
        <div class="password-wrapper">
            <input type="password" id="login-pass" placeholder="Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('login-pass', this)" title="Tampilkan/Sembunyikan Password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <button id="btn-login" onclick="kirimAuth('login')">Masuk</button>
        <br>
        <br>
        <span style="color: #34d399">NB : No. Wa. awali angka 62</span>
        <div id="login-msg" class="status-msg"></div>
        <span class="link-toggle" onclick="tampilkanForm('register')">Belum punya akun? Daftar di sini</span>
    </div>

    <!-- FORM REGISTRASI -->
    <div id="register-box" class="card hidden">
        <h2>Daftar Akun Baru</h2>
        <input type="text" id="reg-nama" placeholder="Nama Lengkap / Panggilan" required>
        <input type="text" id="reg-kontak" placeholder="Email atau No. WA (awali angka 62)" required>

        <div class="password-wrapper">
            <input type="password" id="reg-pass" placeholder="Buat Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('reg-pass', this)" title="Tampilkan/Sembunyikan Password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <button id="btn-register" onclick="kirimAuth('register')">Daftar Sekarang</button>
        <div id="reg-msg" class="status-msg"></div>
        <span class="link-toggle" onclick="tampilkanForm('login')">Sudah punya akun? Login di sini</span>
              
    </div>

    <!-- HALAMAN PEMUTAR MUROTAL -->
    <div id="player-box" class="card hidden">
        <h2>SELAMAT DATANG DI WEBSITE Mochammad Ali Maskur Al Nganju'i</h2>
        <h2>Murotal Al-Qur'an</h2>
       <p id="welcome-text" style="color: #94a3b8; font-size: 14px;"></p>

        <div style="background: #0f172a; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <!-- Dropdown Pilihan Qari -->
            <label for="pilih-qari" class="select-label">Pilih Qari (Suara):</label>
            <select id="pilih-qari" onchange="gantiQari(this.value)" style="margin-top: 0; margin-bottom: 10px; background: #1e293b; border: 1px solid #334155;">
                <option value="mishary">Syekh Mishary Rashid Alafasy</option>
                <option value="sudais">Syekh Abdurrahman As-Sudais</option>
                <option value="maher">Syekh Maher Al-Muaiqly</option>
                <option value="thaha">Muhammad Thaha Al Junayd</option>
            </select>

            <!-- Dropdown Pilihan Surah -->
            <label for="pilih-surah" class="select-label">Pilih Surah:</label>
            <select id="pilih-surah" onchange="putarSurah(Number(this.value), true)" style="margin-top: 0; margin-bottom: 12px; background: #1e293b; border: 1px solid #334155;">
            </select>

            <!-- Judul surah yang sedang diputar -->
            <p id="judul-surah" style="margin-top: 4px; color: #34d399;"><strong>001. Surah Al-Fatihah</strong></p>

            <audio id="audio-player" controls preload="none" style="width: 100%;">
              <source src="https://server8.mp3quran.net/afs/001.mp3" type="audio/mpeg">
                  Browser Anda tidak mendukung pemutar audio.
            </audio>

            <!-- Tombol Navigasi Manual -->
            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <button type="button" onclick="surahSebelumnya()" style="background: #334155; margin-top: 0;">&#9664; Sebelum</button>
                <button type="button" onclick="surahBerikutnya()" style="background: #334155; margin-top: 0;">Sesudah &#9654;</button>                
            </div>
        </div>

        <button type="button" onclick="prosesLogout()" style="background: #ef4444;">Logout</button>
       
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7p_-bqFEJnT7XzoDCxCFJYDNPVqBa-8q7MJnko7vUPNAJkUd_HcIwJxCxiyW3Xgk8qg/exec";

        // Konfigurasi 3 Qari (Server resmi mp3quran.net)
        const daftarQari = {
            mishary: {
                nama: "Syekh Mishary Rashid Alafasy",
                baseUrl: "https://server8.mp3quran.net/afs/"
            },
            sudais: {
                nama: "Syekh Abdurrahman As-Sudais",
                baseUrl: "https://server11.mp3quran.net/sds/"
            },
            maher: {
                nama: "Syekh Maher Al-Muaiqly",
                baseUrl: "https://server12.mp3quran.net/maher/"
            },
            thaha: {
                nama: "Muhammad Thaha Al Junayd",
                baseUrl: "https://server12.mp3quran.net/thaha/"
            }
        };

        const daftarSurah = [
            "Al-Fatihah", "Al-Baqarah", "Ali 'Imran", "An-Nisa'", "Al-Ma'idah", "Al-An'am", "Al-A'raf", "Al-Anfal", "At-Taubah", "Yunus",
            "Hud", "Yusuf", "Ar-Ra'd", "Ibrahim", "Al-Hijr", "An-Nahl", "Al-Isra'", "Al-Kahf", "Maryam", "Taha",
            "Al-Anbiya'", "Al-Hajj", "Al-Mu'minun", "An-Nur", "Al-Furqan", "Asy-Syu'ara'", "An-Naml", "Al-Qasas", "Al-'Ankabut", "Ar-Rum",
            "Luqman", "As-Sajdah", "Al-Ahzab", "Saba'", "Fatir", "Yasin", "As-Saffat", "Sad", "Az-Zumar", "Ghafir",
            "Fussilat", "Asy-Syura", "Az-Zukhruf", "Ad-Dukhan", "Al-Jasiyah", "Al-Ahqaf", "Muhammad", "Al-Fath", "Al-Hujurat", "Qaf",
            "Az-Zariyat", "At-Tur", "An-Najm", "Al-Qamar", "Ar-Rahman", "Al-Waqi'ah", "Al-Hadid", "Al-Mujadilah", "Al-Hasyr", "Al-Mumtahanah",
            "As-Saff", "Al-Jumu'ah", "Al-Munafiqun", "At-Tagabun", "At-Talaq", "At-Tahrim", "Al-Mulk", "Al-Qalam", "Al-Haqqah", "Al-Ma'arij",
            "Nuh", "Al-Jinn", "Al-Muzzammil", "Al-Muddassir", "Al-Qiyamah", "Al-Insan", "Al-Mursalat", "An-Naba'", "An-Nazi'at", "'Abasa",
            "At-Takwir", "Al-Infitar", "Al-Mutaffifin", "Al-Insyiqaq", "Al-Buruj", "At-Tariq", "Al-A'la", "Al-Gasyiyah", "Al-Fajr", "Al-Balad",
            "Asy-Syams", "Al-Lail", "Ad-Duha", "Asy-Syarh", "At-Tin", "Al-'Alaq", "Al-Qadr", "Al-Bayyinah", "Az-Zalzalah", "Al-'Adiyat",
            "Al-Qari'ah", "At-Takasur", "Al-'Asr", "Al-Humazah", "Al-Fil", "Quraisy", "Al-Ma'un", "Al-Kausar", "Al-Kafirun", "An-Nasr",
            "Al-Lahab", "Al-Ikhlas", "Al-Falaq", "An-Nas"
        ];

        let surahAktif = 1;
        let qariAktif = "mishary";

        const audioPlayer = document.getElementById("audio-player");
        const judulSurah = document.getElementById("judul-surah");
        const selectSurah = document.getElementById("pilih-surah");
        const selectQari = document.getElementById("pilih-qari");
        const namaQariEl = document.getElementById("nama-qari");

        // Ikon SVG untuk tombol mata password
        const iconMataTerbuka = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const iconMataTertutup = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        // Fungsi Tampilkan / Sembunyikan Password
        function togglePassword(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btnElement.innerHTML = iconMataTertutup;
            } else {
                input.type = "password";
                btnElement.innerHTML = iconMataTerbuka;
            }
        }

        // 1. Isi dropdown 114 surah saat halaman dimuat
        function inisialisasiDropdown() {
            selectSurah.innerHTML = "";
            daftarSurah.forEach((nama, index) => {
                const nomor = index + 1;
                const format3Digit = String(nomor).padStart(3, "0");
                const option = document.createElement("option");
                option.value = nomor;
                option.text = `${format3Digit}. ${nama}`;
                selectSurah.appendChild(option);
            });
        }

        // 2. Fungsi mengganti Qari
        function gantiQari(kodeQari) {
            if (!daftarQari[kodeQari]) kodeQari = "mishary";
            qariAktif = kodeQari;
            localStorage.setItem("murotal_last_qari", kodeQari);
            selectQari.value = kodeQari;
            namaQariEl.innerText = "oleh : " + daftarQari[kodeQari].nama;

            // Langsung putar surah yang sedang aktif dengan suara Qari baru
            putarSurah(surahAktif, true);
        }

        // 3. Fungsi memutar surah & menyimpan progres terakhir
        function putarSurah(nomor, autoPlay = true) {
            if (nomor < 1) nomor = 114;
            if (nomor > 114) nomor = 1;

            surahAktif = nomor;
            localStorage.setItem("murotal_last_surah", nomor);

            const format3Digit = String(nomor).padStart(3, "0");
            const nama = daftarSurah[nomor - 1];
            const qari = daftarQari[qariAktif] || daftarQari.mishary;

            judulSurah.innerHTML = `<strong>${format3Digit}. Surah ${nama}</strong>`;
            selectSurah.value = nomor;
            audioPlayer.src = `${qari.baseUrl}${format3Digit}.mp3`;
            audioPlayer.load();

            if (autoPlay) {
                audioPlayer.play().catch(err => {
                    console.log("Menunggu interaksi pengguna untuk memutar audio:", err);
                });
            }
        }

        function surahBerikutnya() {
            putarSurah(surahAktif + 1, true);
        }

        function surahSebelumnya() {
            putarSurah(surahAktif - 1, true);
        }

        // 4. Otomatis lanjut ke surah berikutnya saat surah selesai diputar
        audioPlayer.addEventListener("ended", function() {
            surahBerikutnya();
        });

        // 5. Cek sesi login, Qari terakhir, & surah terakhir saat halaman dibuka
        window.addEventListener("DOMContentLoaded", function() {
            inisialisasiDropdown();

            const lastQari = localStorage.getItem("murotal_last_qari") || "mishary";
            qariAktif = daftarQari[lastQari] ? lastQari : "mishary";
            selectQari.value = qariAktif;
            namaQariEl.innerText = "oleh : " + daftarQari[qariAktif].nama;

            const lastSurah = Number(localStorage.getItem("murotal_last_surah")) || 1;
            putarSurah(lastSurah, false); // Muat surah terakhir tanpa auto-play paksa

            const savedUser = localStorage.getItem("murotal_session");
            if (savedUser) {
                const userObj = JSON.parse(savedUser);
                tampilkanPlayer(userObj);
            }
        });

        // 6. Navigasi Form Login & Register
        function tampilkanForm(tipe) {
            document.getElementById("login-msg").innerText = "";
            document.getElementById("reg-msg").innerText = "";
            if (tipe === "register") {
                document.getElementById("login-box").classList.add("hidden");
                document.getElementById("register-box").classList.remove("hidden");
            } else {
                document.getElementById("register-box").classList.add("hidden");
                document.getElementById("login-box").classList.remove("hidden");
            }
        }

        // 7. Kirim data Login / Register ke Google Apps Script
        async function kirimAuth(action) {
            let payload = { action: action };
            let btn, msgBox;

            if (action === "login") {
                payload.kontak = document.getElementById("login-kontak").value;
                payload.password = document.getElementById("login-pass").value;
                btn = document.getElementById("btn-login");
                msgBox = document.getElementById("login-msg");
            } else {
                payload.nama = document.getElementById("reg-nama").value;
                payload.kontak = document.getElementById("reg-kontak").value;
                payload.password = document.getElementById("reg-pass").value;
                btn = document.getElementById("btn-register");
                msgBox = document.getElementById("reg-msg");
            }

            btn.disabled = true;
            btn.innerText = "Memproses...";
            msgBox.className = "status-msg";
            msgBox.innerText = "Menghubungkan ke server...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    msgBox.classList.add("success");
                    msgBox.innerText = result.message;

                    if (action === "register") {
                        setTimeout(() => {
                            tampilkanForm("login");
                            document.getElementById("login-kontak").value = payload.kontak;
                        }, 1500);
                    } else if (action === "login") {
                        localStorage.setItem("murotal_session", JSON.stringify(result.user));
                        tampilkanPlayer(result.user);
                    }
                } else {
                    msgBox.classList.add("error");
                    msgBox.innerText = result.message;
                }
            } catch (error) {
                msgBox.classList.add("error");
                msgBox.innerText = "Gagal terhubung ke server. Periksa koneksi internet Anda.";
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = action === "login" ? "Masuk" : "Daftar Sekarang";
            }
        }

        function tampilkanPlayer(user) {
            document.getElementById("login-box").classList.add("hidden");
            document.getElementById("register-box").classList.add("hidden");
            document.getElementById("player-box").classList.remove("hidden");
            document.getElementById("welcome-text").innerText = "Ahlan wa Sahlan, " + user.nama + " (" + user.kontak + ")";
        }

        function prosesLogout() {
            audioPlayer.pause();
            localStorage.removeItem("murotal_session");
            location.reload();
        }
    </script>
</body>
</html>
